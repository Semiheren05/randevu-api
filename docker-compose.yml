services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: randevuapi
      POSTGRES_USER: randevuapi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-randevuapi}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U randevuapi -d randevuapi"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/randevuapi
      DB_USERNAME: randevuapi
      DB_PASSWORD: ${DB_PASSWORD:-randevuapi}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5500}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      NOTIFICATION_MAIL_FROM: ${NOTIFICATION_MAIL_FROM:-}
    ports:
      - "8080:8080"

volumes:
  db-data:
