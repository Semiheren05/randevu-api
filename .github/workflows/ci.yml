name: CI

on:
  push:
    branches: [main, kontrol]

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests + integration tests (Testcontainers starts PostgreSQL in Docker)
      - name: Build and test
        run: mvn -B verify

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t randevu-api:${{ github.sha }} .
