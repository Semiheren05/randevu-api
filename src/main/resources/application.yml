spring:
  application:
    name: randevu-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/randevuapi}
    username: ${DB_USERNAME:randevuapi}
    password: ${DB_PASSWORD:randevuapi}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations
  flyway:
    enabled: true
  # The mail server is only used when SPRING_MAIL_HOST is set (with SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD).
  # Without it, no mail sender is created and booking emails are simply skipped.
  mail:
    port: ${SPRING_MAIL_PORT:587}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework   # runs behind a reverse proxy

app:
  jwt:
    # Dev-only default. Always set JWT_SECRET (base64, at least 32 bytes) outside local development.
    secret: ${JWT_SECRET:ITrH1qhAa3MILqSppI3Li/9Z8/ZSRsLjMKWloIznS8y4kvUe7oDjchwKlvkxjO8s}
    expiration: ${JWT_EXPIRATION:1h}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:3000}
  booking:
    # Free slots are offered at this step (e.g. 10:00, 10:15, 10:30)
    slot-step: ${BOOKING_SLOT_STEP:15m}
    # Customers can cancel until this long before the appointment
    cancellation-notice: ${BOOKING_CANCELLATION_NOTICE:2h}
    # How far ahead appointments can be booked
    max-days-ahead: ${BOOKING_MAX_DAYS_AHEAD:60}
  notifications:
    # Sender address for booking emails; empty uses the mail server's default
    mail-from: ${NOTIFICATION_MAIL_FROM:}

management:
  health:
    # Do not mark the API as down just because the mail server is unreachable
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
