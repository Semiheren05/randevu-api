<svg xmlns="http://www.w3.org/2000/svg" width="960" height="946" viewBox="0 0 960 946" role="img" aria-label="randevu-api online ödeme akışı">
  <title>randevu-api online ödeme akışı</title>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="okw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="960" height="946" rx="12" fill="#ffffff"/>
  <text x="30" y="40" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2937" font-weight="bold" text-anchor="start">Online ödeme akışı (Stripe Checkout, test modu)</text>
  <text x="30" y="62" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="start">Ödeme isteğe bağlı: ödenmeyen randevu da onaylıdır, müşteri işletmede öder</text>
  <rect x="25" y="94" width="170" height="34" rx="8" fill="#0f766e"/>
  <text x="110" y="116" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle">Müşteri</text>
  <line x1="110" y1="128" x2="110" y2="936" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="285" y="94" width="170" height="34" rx="8" fill="#0f766e"/>
  <text x="370" y="116" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle">API (Spring Boot)</text>
  <line x1="370" y1="128" x2="370" y2="936" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="545" y="94" width="170" height="34" rx="8" fill="#6d28d9"/>
  <text x="630" y="116" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle">Stripe</text>
  <line x1="630" y1="128" x2="630" y2="936" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="775" y="94" width="170" height="34" rx="8" fill="#1d4ed8"/>
  <text x="860" y="116" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle">PostgreSQL</text>
  <line x1="860" y1="128" x2="860" y2="936" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="30" y1="172" x2="930" y2="172" stroke="#e5e7eb" stroke-width="1"/>
  <text x="30" y="190" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">1. Ödeme sayfasını açmak</text>
  <line x1="110" y1="236" x2="364" y2="236" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="120" y="229" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">POST /api/bookings/{id}/payment  (JWT)</text>
  <line x1="370" y1="282" x2="624" y2="282" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="380" y="275" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">POST /v1/checkout/sessions</text>
  <line x1="630" y1="328" x2="376" y2="328" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="380" y="321" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">{ id: cs_test_…, url }</text>
  <line x1="370" y1="374" x2="854" y2="374" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="380" y="367" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">payment_status = PENDING</text>
  <line x1="370" y1="420" x2="116" y2="420" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="120" y="413" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">{ checkoutUrl }</text>
  <line x1="110" y1="466" x2="624" y2="466" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="120" y="459" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">kartla ödeme (Stripe'ın sayfası)</text>
  <rect x="206" y="479" width="548" height="26" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="218" y="497" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start">Tutar kuruş olarak gider (250,00 TL → 25000). Kart bilgileri API'ye hiç uğramaz.</text>
  <line x1="30" y1="518" x2="930" y2="518" stroke="#e5e7eb" stroke-width="1"/>
  <text x="30" y="536" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">2. Ödemenin onaylanması (webhook)</text>
  <line x1="630" y1="582" x2="376" y2="582" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="380" y="575" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">POST /api/payments/webhook</text>
  <rect x="190" y="595" width="580" height="26" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="202" y="613" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start">Stripe-Signature: HMAC-SHA256("t.gövde", whsec_…) · en fazla 5 dk eski · tutmazsa 400</text>
  <line x1="370" y1="658" x2="854" y2="658" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="380" y="651" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">payment_status = PAID</text>
  <rect x="141" y="671" width="678" height="26" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="153" y="689" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start">Aynı olay ikinci kez gelirse bir şey değişmez. Ödemeyi başarı sayfası değil, imzalı webhook onaylar.</text>
  <line x1="30" y1="710" x2="930" y2="710" stroke="#e5e7eb" stroke-width="1"/>
  <text x="30" y="728" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">3. Ödenmiş randevunun iptali</text>
  <line x1="110" y1="774" x2="364" y2="774" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="120" y="767" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">POST /api/bookings/{id}/cancel</text>
  <line x1="370" y1="820" x2="624" y2="820" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="380" y="813" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">POST /v1/refunds  payment_intent=pi_…</text>
  <line x1="370" y1="866" x2="854" y2="866" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="380" y="859" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">CANCELLED + REFUNDED</text>
  <rect x="128" y="879" width="704" height="26" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="140" y="897" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start">İade önce yapılır; Stripe hata verirse randevu iptal edilmez (502). İşletme iptal ederse de aynısı olur.</text>
</svg>
