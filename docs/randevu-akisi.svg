  <line x1="370" y1="300" x2="116" y2="300" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ok)"/>
  <text x="120" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start">["09:00", "09:15", "10:00", ...]</text>
  <line x1="110" y1="346" x2="364" y2="346" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="120" y="339" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start">POST /api/bookings  { startsAt: "...T10:00" }  (JWT)</text>
  <rect x="260" y="375" width="520" height="26" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="272" y="393" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start">1. kontrol: istenen saat hâlâ boş saatler listesinde mi?</text>
  <line x1="370" y1="438" x2="624" y2="438" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="380" y="431" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start">INSERT bookings ... (saveAndFlush)</text>
  <line x1="630" y1="484" x2="376" y2="484" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#okw)"/>
  <text x="380" y="477" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#b91c1c" font-weight="bold" text-anchor="start">2. kontrol: EXCLUDE kısıtı · çakışırsa → 409</text>
  <line x1="370" y1="530" x2="116" y2="530" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ok)"/>
  <text x="120" y="523" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start">201 Created · randevu bilgisi</text>
  <line x1="370" y1="576" x2="854" y2="576" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ok)"/>
  <text x="380" y="569" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start">commit sonrası, ayrı thread'de (@Async + @TransactionalEventListener)</text>
  <line x1="860" y1="622" x2="116" y2="622" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ok)"/>
  <text x="120" y="615" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start">"Randevunuz onaylandı" · işletmeye "Yeni randevu"</text>
</svg>
