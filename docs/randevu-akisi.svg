<svg xmlns="http://www.w3.org/2000/svg" width="960" height="724" viewBox="0 0 960 724" role="img" aria-label="randevu-api randevu alma akışı">
  <title>randevu-api randevu alma akışı</title>
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="okw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="960" height="724" rx="12" fill="#ffffff"/>
  <text x="30" y="40" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2937" font-weight="bold" text-anchor="start">Randevu alma akışı</text>
  <text x="30" y="62" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="start">Boş saatleri görmek herkese açık; randevu almak için müşteri girişi gerekir</text>
  <rect x="25" y="94" width="170" height="34" rx="8" fill="#0f766e" stroke="none" stroke-width="1.2"/>
  <text x="110" y="116" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle">Müşteri</text>
  <line x1="110" y1="128" x2="110" y2="694" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="285" y="94" width="170" height="34" rx="8" fill="#0f766e" stroke="none" stroke-width="1.2"/>
  <text x="370" y="116" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle">API (Spring Boot)</text>
  <line x1="370" y1="128" x2="370" y2="694" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="545" y="94" width="170" height="34" rx="8" fill="#1d4ed8" stroke="none" stroke-width="1.2"/>
  <text x="630" y="116" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle">PostgreSQL</text>
  <line x1="630" y1="128" x2="630" y2="694" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <rect x="775" y="94" width="170" height="34" rx="8" fill="#0f766e" stroke="none" stroke-width="1.2"/>
  <text x="860" y="116" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#ffffff" font-weight="bold" text-anchor="middle">E-posta</text>
  <line x1="860" y1="128" x2="860" y2="694" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="110" y1="162" x2="364" y2="162" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="120" y="155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start">GET /api/businesses/{slug}/availability?offeringId&amp;date</text>
  <line x1="370" y1="208" x2="624" y2="208" stroke="#1f2937" stroke-width="1.5" marker-end="url(#ok)"/>
  <text x="380" y="201" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2937" font-weight="normal" text-anchor="start">o günün onaylı randevuları</text>
  <rect x="260" y="237" width="520" height="26" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
